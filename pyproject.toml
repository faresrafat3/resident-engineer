[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resident-engineer"
version = "2.0.0"
description = "Autonomous Open-Source Resident Engineering System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fares", email = "fares@example.com"}]
keywords = ["autonomous", "open-source", "resident-engineer", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.1.0"]

[project.scripts]
resident-engineer = "resident_engineer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resident_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
